name: Build APK

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Inject the persistent fine-grained PAT (issues:write, repo legion-forge-ci seul)
      # into BuildConfig.GITHUB_TOKEN. Stored as repo secret LEGIONFORGE_GH_TOKEN.
      # The GITHUB_TOKEN natif de workflow expiré à la fin du run CI, on utilise donc
      # le PAT persistant pour que le reporting marche depuis le téléphone.
      - name: Inject GitHub token
        run: |
          printf 'legionforge_github_token=%s\n' "$GHTV" > app/github_token.properties
        env:
          GHTV: ${{ secrets.LEGIONFORGE_GH_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legion-forge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ── Release notes GitHub : notes générées à chaque build master/main ──
      - name: Create GitHub Release with release notes
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          TAG="v${VERSION}"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG existe deja, skip creation."
            exit 0
          fi
          PREV_TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(gh api "/repos/$REPO/compare/$PREV_TAG...$TAG" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null || echo "Changements non listes.")"
          else
            NOTES="- Premiere version publique de Legion Forge v${VERSION}."
          fi
          printf 'Legion Forge v%s\n\n%s\n\nAPK : legion-forge-debug.apk ci-joint.\n' "$VERSION" "$NOTES" > /tmp/release_notes.txt
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$REPO" \
            --title "Legion Forge $VERSION" \
            --notes-file /tmp/release_notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
